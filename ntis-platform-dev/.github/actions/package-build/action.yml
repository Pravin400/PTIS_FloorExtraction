name: NTIS Platform Package Build
description: Build, publish, and upload the NTIS Platform artifacts.

inputs:
  version:
    description: Release version in x.y.z.w format.
    required: true
  branch:
    description: Branch being built.
    required: false
    default: main
  path-mode:
    description: Upload path mode. Use standalone for repo-local runs and orchestrated for ntis-devops runs.
    required: false
    default: standalone
  branch-env-map:
    description: JSON mapping of branch names to environment names.
    required: true
  package-container-name:
    description: Azure Blob container name for package uploads.
    required: true
  package-connection-string:
    description: Azure Storage connection string.
    required: true
  dotnet-version:
    description: .NET SDK version to use.
    required: false
    default: 10.x

outputs:
  version:
    description: Validated version.
    value: ${{ steps.version_setup.outputs.version }}
  artifact-name:
    description: Generated artifact name.
    value: ${{ steps.version_setup.outputs.artifact-name }}
  environment:
    description: Target environment derived from branch.
    value: ${{ steps.version_setup.outputs.environment }}
  branch:
    description: Branch used for the build.
    value: ${{ steps.version_setup.outputs.branch }}

runs:
  using: composite
  steps:
    - name: Setup version and validation
      id: version_setup
      shell: pwsh
      run: |
        $version = '${{ inputs.version }}'
        $branch = '${{ inputs.branch }}'
        $branchEnvMap = '${{ inputs.branch-env-map }}' | ConvertFrom-Json
        $environment = if ($branchEnvMap.PSObject.Properties[$branch]) {
          $branchEnvMap.$branch
        } else {
          'production'
        }

        if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
          Write-Error "Invalid version format: $version. Expected: x.y.z.w"
          exit 1
        }

        $artifactName = "ntis-platform-$environment-v$version"

        "version=$version" >> $env:GITHUB_OUTPUT
        "artifact-name=$artifactName" >> $env:GITHUB_OUTPUT
        "environment=$environment" >> $env:GITHUB_OUTPUT
        "branch=$branch" >> $env:GITHUB_OUTPUT

        Write-Output "Building NTIS-Platform v$version for $environment"
        Write-Output "Artifact name: $artifactName"

    - name: Verify repository structure
      shell: pwsh
      run: |
        Write-Output "Current directory: $(Get-Location)"
        Write-Output "Solution file exists: $(Test-Path 'NtisPlatform.sln')"
        Write-Output "Core project exists: $(Test-Path 'src/Core/NtisPlatform.Core/NtisPlatform.Core.csproj')"
        if (-not (Test-Path 'NtisPlatform.sln')) {
          Write-Error "Solution file not found in current directory"
          Get-ChildItem -Path . | Format-Table Name
          exit 1
        }

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: ${{ inputs.dotnet-version }}

    - name: Clean build artifacts (self-hosted safety)
      shell: pwsh
      run: |
        Write-Output "Cleaning previous build artifacts..."
        dotnet clean NtisPlatform.sln --configuration Release -v:minimal
        Get-ChildItem -Path . -Include bin,obj -Recurse -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
        Remove-Item -Path publish -Recurse -Force -ErrorAction SilentlyContinue
        Write-Output "Clean completed successfully"

    - name: Restore dependencies
      shell: pwsh
      run: |
        Write-Output "Restoring NuGet packages..."
        dotnet restore NtisPlatform.sln
        Write-Output "Dependencies restored successfully"

    - name: Build solution with version
      shell: pwsh
      run: |
        $version = '${{ steps.version_setup.outputs.version }}'

        Write-Output "Building NTIS-Platform v$version in Release configuration..."

        dotnet build NtisPlatform.sln `
          --configuration Release `
          --no-restore `
          -p:Version=$version `
          -p:AssemblyVersion=$version `
          -p:FileVersion=$version `
          -p:InformationalVersion=$version

        Write-Output "Build completed successfully"

    - name: Publish API
      shell: pwsh
      run: |
        $version = '${{ steps.version_setup.outputs.version }}'

        Write-Output "Publishing NTIS Platform API v$version..."

        dotnet publish src/Presentation/NtisPlatform.Api/NtisPlatform.Api.csproj `
          --configuration Release `
          --output publish/api `
          --runtime win-x64 `
          --self-contained false `
          -p:Version=$version `
          -p:AssemblyVersion=$version `
          -p:FileVersion=$version `
          -p:InformationalVersion=$version `
          --verbosity normal

        Write-Output "API published successfully"

    - name: Publish Worker
      shell: pwsh
      run: |
        $version = '${{ steps.version_setup.outputs.version }}'

        Write-Output "Publishing NTIS Platform Worker v$version..."

        dotnet publish src/Presentation/NtisPlatform.Worker/NtisPlatform.Worker.csproj `
          --configuration Release `
          --output publish/worker `
          --runtime win-x64 `
          --self-contained false `
          -p:Version=$version `
          -p:AssemblyVersion=$version `
          -p:FileVersion=$version `
          -p:InformationalVersion=$version `
          --verbosity normal

        Write-Output "Worker published successfully"

    - name: Analyze build output
      shell: pwsh
      run: |
        if (Test-Path 'publish/api') {
          $apiSize = (Get-ChildItem -Path 'publish/api' -Recurse | Measure-Object -Property Length -Sum).Sum
          $apiSizeMB = [math]::Round($apiSize / 1MB, 2)
          Write-Output "API build size: $apiSizeMB MB"
        }

        if (Test-Path 'publish/worker') {
          $workerSize = (Get-ChildItem -Path 'publish/worker' -Recurse | Measure-Object -Property Length -Sum).Sum
          $workerSizeMB = [math]::Round($workerSize / 1MB, 2)
          Write-Output "Worker build size: $workerSizeMB MB"
        }

        $apiDll = 'publish/api/NtisPlatform.Api.dll'
        $workerDll = 'publish/worker/NtisPlatform.Worker.dll'

        if (-not (Test-Path $apiDll)) {
          Write-Error "API assembly not found"
          exit 1
        }

        if (-not (Test-Path $workerDll)) {
          Write-Error "Worker assembly not found"
          exit 1
        }

        Write-Output "Platform assemblies generated successfully"

    - name: Create zip archives
      shell: pwsh
      run: |
        $version = '${{ steps.version_setup.outputs.version }}'
        $environment = '${{ steps.version_setup.outputs.environment }}'
        $apiZip = "ntis-platform-api-$environment-v$version.zip"
        $workerZip = "ntis-platform-worker-$environment-v$version.zip"

        Write-Output "Creating API zip archive..."
        Compress-Archive -Path "publish/api/*" -DestinationPath $apiZip -Force
        $apiZipSize = [math]::Round((Get-Item $apiZip).Length / 1MB, 2)
        Write-Output "Created $apiZip ($apiZipSize MB)"

        Write-Output "Creating Worker zip archive..."
        Compress-Archive -Path "publish/worker/*" -DestinationPath $workerZip -Force
        $workerZipSize = [math]::Round((Get-Item $workerZip).Length / 1MB, 2)
        Write-Output "Created $workerZip ($workerZipSize MB)"

    - name: Upload to Azure Blob Storage
      shell: pwsh
      run: |
        $version = '${{ steps.version_setup.outputs.version }}'
        $environment = '${{ steps.version_setup.outputs.environment }}'
        $pathMode = '${{ inputs.path-mode }}'
        $containerName = '${{ inputs.package-container-name }}'
        $connectionString = '${{ inputs.package-connection-string }}'
        $basePath = if ($pathMode -eq 'orchestrated') { "$environment/$version/platform" } else { "platform/$version" }
        $apiZip = "ntis-platform-api-$environment-v$version.zip"
        $workerZip = "ntis-platform-worker-$environment-v$version.zip"

        Write-Output "Uploading to Azure Blob Storage..."
        Write-Output "Container: $containerName"
        Write-Output "Path: $basePath"

        Write-Output "Uploading API zip..."
        az storage blob upload `
          --connection-string "$connectionString" `
          --container-name "$containerName" `
          --file $apiZip `
          --name "$basePath/$apiZip" `
          --overwrite
        Write-Output "Uploaded: $basePath/$apiZip"

        Write-Output "Uploading Worker zip..."
        az storage blob upload `
          --connection-string "$connectionString" `
          --container-name "$containerName" `
          --file $workerZip `
          --name "$basePath/$workerZip" `
          --overwrite
        Write-Output "Uploaded: $basePath/$workerZip"

    - name: Cleanup zip files
      if: ${{ always() }}
      shell: pwsh
      run: |
        $version = '${{ steps.version_setup.outputs.version }}'
        $environment = '${{ steps.version_setup.outputs.environment }}'
        Remove-Item -Path "ntis-platform-api-$environment-v$version.zip" -Force -ErrorAction SilentlyContinue
        Remove-Item -Path "ntis-platform-worker-$environment-v$version.zip" -Force -ErrorAction SilentlyContinue
